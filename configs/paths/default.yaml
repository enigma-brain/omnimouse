# path to root directory
# this requires PROJECT_ROOT environment variable to exist
# you can replace it with "." if you want the root to be the current working directory
root_dir: ${oc.env:PROJECT_ROOT}

# # Create a temporary directory that will be automatically removed when the process exits
# efemeral_dir: ${generate_temp_dir:nfmtmp_}

# path to data directory
data_dir: ${paths.root_dir}/data

# Name of larger experiment which run is a part of, e.g. "response-only-modeling"
experiment_name: omnimouse
# `run_name`, generated by the `generate_run_name` resolver, provides a unique,
# recognizable name for the run, shared by hydra, loggers, etc...
# The resolver is registered in `hydra_plugins/resolvers.py` and takes 
# an optional `num_random_words` argument.
# TODO: Support distributed runs with `generate_run_name` resolver
run_name: ??? # ${generate_run_name:2}

# path to logging directory
log_dir: ${paths.root_dir}/logs/  # ${paths.efemeral_dir}/logs/

# path to output directory, created dynamically by hydra
# path generation pattern is specified in `configs/hydra/default.yaml`
# use it to store all files generated during the run, like ckpts and metrics
output_dir: ${.log_dir}/${task_name}/runs/${.run_name}

# # path to working directory
# work_dir: ${hydra:runtime.cwd}
